<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FAQ / Словарь</title>
</head>
<body>
    <h1>Словарь терминов и часто задаваемые вопросы</h1>
    <p><a href="{% url 'lab_5:home' %}">На главную</a></p>
    <hr>
    {% for item in faqs %}
        <h3>❓ {{ item.question }}</h3>
        <p>❗ {{ item.answer }}</p>
        <small>Добавлено: {{ item.created_at|date:"d/m/Y" }}</small>
        <hr>
    {% empty %}
        <p>Словарь терминов пока пуст. Добавьте записи в админке.</p>
    {% endfor %}
</body>
</html>
